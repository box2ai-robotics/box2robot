# Diffusion Policy config for Box2Robot 6-DOF arm
# These are recommended defaults passed via Server job custom_params.

policy:
  type: diffusion
  # Denoising backbone: "unet" (CNN UNet w/ FiLM, original DP) or "transformer".
  arch: unet
  horizon: 16                 # Action prediction horizon
  n_obs_steps: 2              # Observation lookback
  n_action_steps: 8           # Execute 8 steps per prediction

  # Vision encoder (shared by both arch variants).
  vision_backbone: resnet18
  use_group_norm: true
  spatial_softmax_num_keypoints: 32
  # Image preprocessing / augmentation.
  resize_shape: null          # [H, W] to resize before crop, or null to skip resize.
  crop_ratio: 1.0             # In (0, 1]. <1.0 enables crop (combined with resize_shape).
  crop_shape: null            # [H, W] explicit crop. Overrides crop_ratio when set.
  crop_is_random: true        # Random crop during train, center crop at eval.

  # --- UNet head (used when arch == "unet") ---
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  use_film_scale_modulation: true

  # --- Transformer head (used when arch == "transformer") ---
  # horizon does NOT need to be divisible by 2^len(down_dims) in this mode.
  n_layers: 8                 # Decoder layers (denoising trunk).
  n_heads: 4                  # Attention heads; n_emb must be divisible by n_heads.
  n_emb: 256                  # Embedding / hidden dim.
  p_drop_emb: 0.0
  p_drop_attn: 0.1
  n_cond_layers: 0            # 0 = MLP cond encoder, >0 = TransformerEncoder layers.
  causal_attn: false

  # Noise scheduler
  noise_scheduler_type: DDPM
  num_train_timesteps: 100
  beta_schedule: squaredcos_cap_v2
  prediction_type: epsilon
  clip_sample: true
  clip_sample_range: 1.0

training:
  steps: 10000
  batch_size: 64
  lr: 1.0e-4
  betas: [0.95, 0.999]
  weight_decay: 1.0e-6
  scheduler_warmup_steps: 500

dataset:
  fps: 20
  servo_count: 6
  pos_max: 4095

# GPU recommendations (arch=unet):
#   RTX 3060 (12GB): batch_size 32,  ~3h / 10000 steps
#   RTX 3090 (24GB): batch_size 64,  ~2h / 10000 steps
#   RTX 4090 (24GB): batch_size 128, ~1h / 10000 steps
#
# Transformer head is roughly +20% VRAM at n_emb=256, n_layers=8.
# Drop batch_size by ~25% if you hit OOM.
