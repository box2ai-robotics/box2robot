# Pi0.5 (π₀.₅) config for Box2Robot 6-DOF arm — VLA with open-world generalization
# Fine-tunes from lerobot/pi05_base (trained on droid + heterogeneous robot data).
# Requires camera images. dataset 转换后由 worker 自动补 q01/q99 stats (QUANTILES normalization).

policy:
  type: pi05
  pretrained_path: "lerobot/pi05_base"   # PaliGemma 2B + Gemma 300M action expert
  chunk_size: 50                # 50 actions per prediction (2.5s at 20Hz)
  n_action_steps: 50            # n_action_steps <= chunk_size
  n_obs_steps: 1

  # Architecture (from pi05_base, 通常无需改)
  paligemma_variant: "gemma_2b"
  action_expert_variant: "gemma_300m"
  image_resolution: [224, 224]
  max_state_dim: 32
  max_action_dim: 32

  # Flow matching (denoising 推理步数)
  num_inference_steps: 10

  # Camera: dataset 单相机时无需改, lerobot 自动用 -1 padding 多余 cam
  empty_cameras: 0

  # Tokenizer
  tokenizer_max_length: 200      # pi05 比 pi0 长 (48), 支持更复杂 task description

  # Normalization (pi05 默认 QUANTILES, 比 mean/std 抗机器人轨迹边界值更鲁棒.
  # worker 训练前会自动调 augment_dataset_quantile_stats 给 dataset 补 q01/q99)
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES

  # Memory optimization (VLA 模型大)
  dtype: bfloat16
  gradient_checkpointing: true
  compile_model: false           # A100+ 上可设 true 加速 (要求 torch.compile 可用)

  # Fine-tune strategy
  # Full fine-tune (default): 训所有参数, 效果最好但 ~24GB VRAM
  # train_expert_only=true: 冻结 VLM, 只训 action expert + projections, ~12GB VRAM
  train_expert_only: false
  freeze_vision_encoder: false

  # Relative actions: 预测相对于当前 state 的偏移 (而非绝对位置). 改善某些任务的稳定性.
  # 启用前需重算 dataset stats: lerobot-edit-dataset --operation.relative_action true
  use_relative_actions: false
  relative_exclude_joints: ["gripper"]

training:
  steps: 30000                   # pi05 较 pi0 收敛慢, 建议 20k+ steps
  batch_size: 8                  # bf16+gradient_checkpointing 下 24GB GPU 可跑 8
  lr: 2.5e-5                     # = openpi CosineDecaySchedule peak_lr
  betas: [0.9, 0.95]
  weight_decay: 0.01
  grad_clip_norm: 1.0
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 30000
  scheduler_decay_lr: 2.5e-6

dataset:
  fps: 20
  servo_count: 6
  pos_max: 4095

# GPU recommendations (Pi0.5 ~3B params):
#   RTX 3090 (24GB): batch_size 4,  expert_only=true,   ~10h / 30000 steps
#   RTX 4090 (24GB): batch_size 8,  expert_only=true,    ~5h / 30000 steps
#   A100   (40GB):   batch_size 16, full fine-tune,      ~3h / 30000 steps
#   A100   (80GB):   batch_size 32, full fine-tune,    ~1.5h / 30000 steps
# Note: 数据集必须含图像; worker 会自动补 quantile stats.
